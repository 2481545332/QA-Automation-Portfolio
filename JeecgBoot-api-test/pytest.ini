[pytest]
# 默认添加的命令行参数
addopts = -s --alluredir=allure-results
# 测试用例目录
testpaths = testcases
# 匹配用例文件规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 编码
env = LANG=zh_CN.UTF-8

# 注册自定义标记（防止运行时报 PytestUnknownMarkWarning 警告）
markers =
    smoke: 冒烟测试用例（系统最核心的主流程）
    login: 登录模块用例
    doc: 文档模块用例
    permission: 权限隔离用例（跨部门越权校验）